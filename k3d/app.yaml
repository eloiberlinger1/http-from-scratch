apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-webserver
  namespace: default
  labels:
    app: go-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-webserver
  template:
    metadata:
      labels:
        app: go-webserver
    spec:
      containers:
        - name: webserver
          image: go-webserver:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-webserver
  namespace: default
  labels:
    app: go-webserver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: go-webserver
