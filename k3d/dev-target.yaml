apiVersion: v1
kind: Service
metadata:
  name: go-webserver-dev
  namespace: default
  labels:
    app: go-webserver-dev
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: go-webserver-dev  # DOIT avoir exactement le même nom que le Service
  namespace: default
subsets:
  - addresses:
      - ip: 172.17.0.1    # Remplacez par votre IP locale ou l'IP de host docker
    ports:
      - name: http
        port: 8080
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: go-webserver-dev-scrape
  namespace: default
spec:
  selector:
    matchLabels:
      app: go-webserver-dev
  endpoints:
    - port: http
      path: /metrics
      interval: 5s         # 5s pour voir immédiatement les changements en dev
